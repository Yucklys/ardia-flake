name: update

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Update Ardia
        id: ardia
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "version=$(./update.sh)" >> "$GITHUB_OUTPUT"

      - name: Update nixpkgs
        run: nix flake update

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: nix build .#ardia --print-build-logs

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.ardia.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          if [ -n "$VERSION" ]; then
            message="ardia: $VERSION"
          else
            message="flake.lock: update nixpkgs"
          fi
          git commit -am "$message"
          git push
